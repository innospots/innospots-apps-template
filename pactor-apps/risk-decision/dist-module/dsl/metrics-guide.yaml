dsl: "1.0"
page:
  id: metrics-guide
  title: 指标说明
body:
  type: Page
  props:
    className: p-0 risk-page
  children:
    - type: Header
      props:
        className: risk-topbar
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
            className: risk-topbar-heading
          children:
            - type: Text
              props:
                text: 风险决策 / 指标说明
                className: risk-topbar-breadcrumb
            - type: Typography
              props:
                variant: h2
                text: 指标说明
                className: risk-topbar-title
        - type: Flex
          props:
            className: risk-topbar-actions
            align: center
            gap: 8
          children:
            - type: Button
              props:
                text: 返回总览
                icon: arrow-left
                size: small
                variant: default
              events:
                onClick:
                  - action: navigate
                    params:
                      to: /pactor-app-risk-decision/
    - type: Text
      props:
        text: 对接监控各项指标的口径说明
        className: risk-page-subtitle
    - type: Card
      props:
        title: 指标口径
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 8
          children:
            - type: Text
              props:
                text: 已对接系统：已完成接口联调并处于启用状态的系统数量。
            - type: Text
              props:
                text: 今日同步量：当日各对接系统累计同步的数据条数。
            - type: Text
              props:
                text: 调用成功率：统计期内成功调用次数占全部调用次数的比例。
            - type: Text
              props:
                text: 待处理异常：尚未完成排查处理的异常调用 / 同步任务数量。
            - type: Text
              props:
                text: 数据同步趋势：近 7 天每日同步量与失败量的变化情况。
