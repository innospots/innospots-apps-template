id: site
resourceType: sitemap
version: 1
dslVersion: "1.0"
app:
  name: Pactor Console
layout: risk-decision-admin
layouts:
  risk-decision-admin:
    dsl: "1.0"
    parent: shell
    body:
      type: Layout
      props:
        className: app-shell
      children:
        - type: Sider
          props:
            width: 224
            className: app-shell-sider
          children:
            - type: Text
              props:
                text: Pactor Console
                strong: true
                className: app-shell-brand
            - type: SitemapMenu
              props:
                items: ${data.session.menus}
              events:
                onSelect:
                  - action: navigate
                    params:
                      to: ${event}
        - type: Content
          props:
            className: app-shell-content
          children:
            - type: PageOutlet
pages:
  - id: risk-decision
    path: /
    title: 总览
    version: 1
    file: risk-decision/risk-decision.page.yaml
  - id: integration-logs
    path: /integration-logs
    title: 对接日志
    version: 1
    file: risk-decision/integration-logs.page.yaml
  - id: metrics-guide
    path: /guide
    title: 指标说明
    version: 1
    file: risk-decision/metrics-guide.page.yaml
menus:
  - id: risk-decision
    type: page
    pageId: risk-decision
    title: 风险决策
    icon: shield
    layout: risk-decision-admin
    public: true
  - id: integration-logs
    type: page
    pageId: integration-logs
    title: 对接日志
    icon: file-text
    layout: risk-decision-admin
    public: true
  - id: metrics-guide
    type: page
    pageId: metrics-guide
    title: 指标说明
    icon: info
    layout: risk-decision-admin
    public: true
