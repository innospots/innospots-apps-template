# 单页应用：数据价值分析工作台。
# 页面与布局 DSL 在 /api/sitemap 响应中内联下发；
# 菜单独立为 /api/menus 接口，客户端多源合并。
# 应用外壳：左侧二级菜单（应用自己的菜单）+ 右侧内容区独立滚动。
# 接入 Shell 时外层再套一层 Shell 一级导航（60px 图标轨），见 parent: shell。
id: site
resourceType: sitemap
version: 1
dslVersion: "1.0"
app: { name: Pactor Console }
layout: risk-analysis-admin

layouts:
  # 布局名在 Shell 内全局唯一（两个业务模块各有一套，避免互相覆盖）。
  # Standalone 时作为根布局；接入 Shell 后以 parent: shell 嵌套在
  # Shell 的内容区内，Sidebar 由 Shell 提供，这里只渲染应用自己的菜单。
  risk-analysis-admin:
    dsl: "1.0"
    parent: shell
    body:
      type: Layout
      props: { className: "app-shell" }
      children:
        # 二级导航：应用自己的菜单，占满剩余高度、独立滚动
        - type: Sider
          props:
            width: 224
            className: "app-shell-sider"
          children:
            - type: Text
              props:
                text: Pactor Console
                strong: true
                className: "app-shell-brand"
            - type: SitemapMenu
              props:
                items: ${data.session.menus}
              events:
                onSelect:
                  - action: navigate
                    params: { to: "${event}" }
        - type: Content
          props: { className: "app-shell-content" }
          children:
            - type: PageOutlet

pages:
  - id: operations-workbench
    path: /workbench/operations
    title: 运营工作台
    version: 1
    file: risk-analysis/operations-workbench.page.yaml
  - id: task-workbench
    path: /workbench/tasks
    title: 任务工作台
    version: 1
    file: risk-analysis/task-workbench.page.yaml
  - id: risk-data-value
    path: /
    title: 数据价值分析工作台
    version: 1
    file: risk-analysis/risk-data-value.page.yaml
  # 静态说明页：新增菜单 / 页面示例
  - id: analysis-guide
    path: /guide
    title: 分析说明
    version: 1
    file: risk-analysis/analysis-guide.page.yaml

# 菜单由 /api/menus 下发；此处 $include 供模块打包展开为内联 menus。
menus:
  $include: menus.yaml
