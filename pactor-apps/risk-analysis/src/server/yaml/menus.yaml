# 独立运行时展示分组；接入 Shell 后 root 分组挂载到 Shell 一级导航。
- id: workbench
  type: group
  title: 工作台
  icon: layout-dashboard
  root: true
  children:
    - { id: operations-workbench, type: page, pageId: operations-workbench, path: /workbench/operations, title: 运营工作台, icon: activity, layout: risk-analysis-admin, public: true }
    - { id: task-workbench, type: page, pageId: task-workbench, path: /workbench/tasks, title: 任务工作台, icon: list, layout: risk-analysis-admin, public: true }
- id: analysis
  type: group
  title: 分析
  icon: chart
  root: true
  children:
    - { id: risk-analysis, type: page, pageId: risk-data-value, path: /, title: 风险分析, icon: chart, layout: risk-analysis-admin, public: true }
    - { id: analysis-guide, type: page, pageId: analysis-guide, path: /guide, title: 分析说明, icon: file-text, layout: risk-analysis-admin, public: true }
