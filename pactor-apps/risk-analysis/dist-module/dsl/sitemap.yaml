id: site
resourceType: sitemap
version: 1
dslVersion: "1.0"
app:
  name: Pactor Console
layout: risk-analysis-admin
layouts:
  risk-analysis-admin:
    dsl: "1.0"
    parent: shell
    body:
      type: Layout
      props:
        className: app-shell
      children:
        - type: Sider
          props:
            width: 224
            className: app-shell-sider
          children:
            - type: Text
              props:
                text: Pactor Console
                strong: true
                className: app-shell-brand
            - type: SitemapMenu
              props:
                items: ${data.session.menus}
              events:
                onSelect:
                  - action: navigate
                    params:
                      to: ${event}
        - type: Content
          props:
            className: app-shell-content
          children:
            - type: PageOutlet
pages:
  - id: risk-data-value
    path: /
    title: 数据价值分析工作台
    version: 1
    file: risk-analysis/risk-data-value.page.yaml
  - id: analysis-guide
    path: /guide
    title: 分析说明
    version: 1
    file: risk-analysis/analysis-guide.page.yaml
menus:
  - id: risk-analysis
    type: page
    pageId: risk-data-value
    title: 风险分析
    icon: chart
    layout: risk-analysis-admin
    public: true
  - id: analysis-guide
    type: page
    pageId: analysis-guide
    title: 分析说明
    icon: file-text
    layout: risk-analysis-admin
    public: true
