# Shell 默认页面布局。
# 最左侧为 60px 宽的一级导航图标轨（Sidebar + 收起态 Menu）：
#   - 一级菜单项由 sitemap.yaml 的 menus（root: true）声明；
#   - 图标轨只展示图标，悬浮显示 Tooltip；
#   - 当前路径所属应用由 PactorHost 按最长前缀匹配，作为 selectedKey。
# 右侧 Content 内的 PageOutlet 渲染业务应用自己的布局：应用二级菜单
# （应用内 Sider，宽 224px）+ 页面内容，由应用布局的 parent: shell 嵌套。
dsl: "1.0"
body:
  type: Layout
  props: { className: "h-dvh overflow-hidden bg-zinc-50" }
  children:
    - type: Sidebar
      props:
        className: "flex-1"
        style:
          minHeight: 0
          # 覆盖主题令牌：Sidebar 的占位宽度与固定容器宽度都取该变量
          "--sidebar-width": "60px"
        collapsible: false
        content:
          type: Menu
          props:
            items: ${data.session.rootMenus}
            mode: inline
            collapsed: true
            selectedKey: ${data.session.activeRootKey}
          events:
            onSelect:
              - action: navigate
                params: { to: "${event}" }
      children:
        - type: Content
          props:
            className: "overflow-hidden"
            style: { background: "var(--background)" }
          children:
            - type: PageOutlet
